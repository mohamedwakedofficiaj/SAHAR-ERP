<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوسام ERP — النسخة المتصلة الحقيقية</title>
<style>
  :root{
    --navy-950:#03222b; --navy-900:#063440; --teal:#0e7490; --teal-soft:#e4f1f5;
    --ink:#0c2126; --muted:#5b7278; --line:#dbe7e9; --bg:#f2f7f8; --card:#fff;
    --red:#c4443a; --red-soft:#fbe9e7; --amber:#c8860a; --amber-soft:#fbf1de;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Tajawal,sans-serif; }
  .topbar{ background:var(--navy-900); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  .topbar b{ font-size:16px; }
  .badge{ background:var(--teal); font-size:11px; padding:3px 10px; border-radius:20px; margin-right:10px; }
  .wrap{ max-width:1000px; margin:0 auto; padding:24px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 24px; margin-bottom:18px; }
  .card h3{ margin:0 0 14px; font-size:16px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:right; color:var(--muted); font-size:12px; padding:8px; border-bottom:1px solid var(--line); }
  td{ padding:9px 8px; border-bottom:1px solid #eef1f5; }
  .mono{ font-family:'IBM Plex Mono',monospace; direction:ltr; display:inline-block; }
  input, select{ padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; width:100%; }
  button{ background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-family:inherit; }
  button.secondary{ background:#fff; color:var(--ink); border:1px solid var(--line); }
  .status{ padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none; }
  .status.error{ background:var(--red-soft); color:var(--red); display:block; }
  .status.ok{ background:var(--teal-soft); color:var(--teal); display:block; }
  #login-view{ max-width:380px; margin:80px auto; }
  #app-view{ display:none; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .field{ margin-bottom:14px; }
</style>
</head>
<body>

<div id="login-view" class="card">
  <h3>تسجيل الدخول — النسخة الحقيقية المتصلة</h3>
  <div id="login-status" class="status"></div>
  <div class="field"><label>البريد الإلكتروني</label><input id="li-email" value="mohamedwakedofficial@gmail.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="li-password" type="password" value="ChangeMe123!"></div>
  <button style="width:100%" onclick="doLogin()">دخول</button>
</div>

<div id="app-view">
  <div class="topbar">
    <div><b>الوسام ERP</b> <span class="badge">متصل بقاعدة بيانات حقيقية</span></div>
    <div>
      <select id="company-select" onchange="onCompanyChange()" style="width:auto; display:inline-block;"></select>
      <button class="secondary" onclick="doLogout()">خروج</button>
    </div>
  </div>
  <div class="wrap">
    <div id="app-status" class="status"></div>

    <div class="card">
      <h3>ميزان المراجعة — بيانات حقيقية من قاعدة البيانات</h3>
      <table id="tb-table"><tr><td style="color:var(--muted);">جاري التحميل...</td></tr></table>
    </div>

    <div class="card">
      <h3>العملاء</h3>
      <table id="customers-table"></table>
      <div class="grid" style="margin-top:14px;">
        <input id="nc-name" placeholder="اسم عميل جديد">
        <button onclick="addCustomer()">+ إضافة عميل حقيقي</button>
      </div>
    </div>

    <div class="card">
      <h3>الموردون</h3>
      <table id="suppliers-table"></table>
    </div>

    <div class="card">
      <h3>البنوك</h3>
      <table id="banks-table"></table>
    </div>
  </div>
</div>

<script>
  const API = ''; // same-origin — works automatically wherever this file is hosted
  let TOKEN = sessionStorage.getItem('alwisam_token') || null;
  let COMPANIES = [];
  let CURRENT_COMPANY = null;

  function showStatus(elId, msg, type){
    const el = document.getElementById(elId);
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  async function api(path, options = {}){
    const res = await fetch(API + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}),
        ...(options.headers || {}),
      },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('خطأ من السيرفر: ' + res.status));
    return data;
  }

  async function doLogin(){
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-password').value;
    try {
      const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      TOKEN = data.token;
      sessionStorage.setItem('alwisam_token', TOKEN);
      COMPANIES = data.companies || [];
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      populateCompanySelect();
      if (COMPANIES.length) await onCompanyChange();
    } catch (err) {
      showStatus('login-status', 'فشل الدخول: ' + err.message, 'error');
    }
  }

  function doLogout(){
    sessionStorage.removeItem('alwisam_token');
    TOKEN = null;
    document.getElementById('app-view').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
  }

  function populateCompanySelect(){
    const sel = document.getElementById('company-select');
    sel.innerHTML = COMPANIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  async function onCompanyChange(){
    CURRENT_COMPANY = document.getElementById('company-select').value || COMPANIES[0]?.id;
    if (!CURRENT_COMPANY) return;
    await Promise.all([loadTrialBalance(), loadCustomers(), loadSuppliers(), loadBanks()]);
  }

  function fmt(n){ return Math.round(Number(n)).toLocaleString('en-US'); }

  async function loadTrialBalance(){
    try {
      const rows = await api(`/api/reports/trial-balance?company_id=${CURRENT_COMPANY}`);
      const table = document.getElementById('tb-table');
      if (!rows.length){ table.innerHTML = '<tr><td style="color:var(--muted);">لا توجد قيود مرحّلة لهذه الشركة بعد.</td></tr>'; return; }
      let html = '<tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>';
      rows.forEach(r => {
        html += `<tr><td>${r.account_name}</td><td class="mono">${fmt(r.total_debit)}</td><td class="mono">${fmt(r.total_credit)}</td><td class="mono">${fmt(r.balance)}</td></tr>`;
      });
      table.innerHTML = html;
      showStatus('app-status', '✓ البيانات دي حقيقية جاية من قاعدة البيانات على Railway — مش أرقام تجريبية.', 'ok');
    } catch (err) {
      showStatus('app-status', 'خطأ في تحميل ميزان المراجعة: ' + err.message, 'error');
    }
  }

  async function loadCustomers(){
    try {
      const rows = await api(`/api/customers?company_id=${CURRENT_COMPANY}`);
      const table = document.getElementById('customers-table');
      let html = '<tr><th>الاسم</th><th>الرصيد</th></tr>';
      rows.forEach(r => { html += `<tr><td>${r.name}</td><td class="mono">${fmt(r.balance || 0)}</td></tr>`; });
      table.innerHTML = html || '<tr><td style="color:var(--muted);">لا يوجد عملاء بعد لهذه الشركة.</td></tr>';
    } catch (err) { console.warn(err); }
  }

  async function addCustomer(){
    const name = document.getElementById('nc-name').value.trim();
    if (!name) return;
    try {
      await api('/api/customers', { method: 'POST', body: JSON.stringify({ company_id: CURRENT_COMPANY, name }) });
      document.getElementById('nc-name').value = '';
      await loadCustomers();
      showStatus('app-status', `✓ تم إضافة "${name}" فعليًا في قاعدة البيانات الحقيقية.`, 'ok');
    } catch (err) {
      showStatus('app-status', 'خطأ: ' + err.message, 'error');
    }
  }

  async function loadSuppliers(){
    try {
      const rows = await api(`/api/suppliers?company_id=${CURRENT_COMPANY}`);
      const table = document.getElementById('suppliers-table');
      let html = '<tr><th>الاسم</th><th>النوع</th><th>الرصيد</th></tr>';
      rows.forEach(r => { html += `<tr><td>${r.name}</td><td>${r.scope||'—'}</td><td class="mono">${fmt(r.balance || 0)}</td></tr>`; });
      table.innerHTML = html || '<tr><td style="color:var(--muted);">لا يوجد موردون بعد.</td></tr>';
    } catch (err) { console.warn(err); }
  }

  async function loadBanks(){
    try {
      const rows = await api(`/api/banks?company_id=${CURRENT_COMPANY}`);
      const table = document.getElementById('banks-table');
      let html = '<tr><th>البنك</th><th>الرصيد</th></tr>';
      rows.forEach(r => { html += `<tr><td>${r.name}</td><td class="mono">${fmt(r.balance)}</td></tr>`; });
      table.innerHTML = html || '<tr><td style="color:var(--muted);">لا توجد بنوك مسجّلة بعد.</td></tr>';
    } catch (err) { console.warn(err); }
  }

  // if a token already exists in this browser session, skip straight to the app
  if (TOKEN) {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
    api('/api/companies').then(companies => {
      COMPANIES = companies;
      populateCompanySelect();
      if (COMPANIES.length) onCompanyChange();
    }).catch(doLogout);
  }
</script>
</body>
</html>
